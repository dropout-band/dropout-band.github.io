<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1269 247" width="1269" height="247" role="img" aria-labelledby="title desc">
  <title id="title">MKL.studio — logo animé</title>
  <desc id="desc">Logo blanc sur fond noir. Deux accolades lisses encadrent un point qui devient carré en quatre secondes. Le nom MKL.studio est en pixel art ; de temps en temps, les lettres de « studio » se changent en signes qui défilent, une lettre après l’autre, avant de se fixer.</desc>
  <style>
    .static-symbol, .static-studio { display: none; }
    @media (prefers-reduced-motion: reduce) {
      .animated-symbol, .animated-studio, .animated-braces { display: none; }
      .static-symbol, .static-studio { display: inline; }
    }
  </style>
  <g id="code-symbol" class="static-symbol" fill="none" stroke="#fff" stroke-width="20" stroke-linecap="butt" stroke-linejoin="round">
    <path id="left-brace" d="M94 42 C68 42 66 55 66 76 L66 91 C66 112 57 122 42 124 C57 126 66 136 66 157 L66 172 C66 193 68 206 94 206"/>
    <use href="#left-brace" transform="translate(302 0) scale(-1 1)"/>
  </g>
  <!-- les deux accolades se métamorphosent en spirale vers le point, puis reviennent à leur forme (toutes les 2 secondes) -->
  <g class="animated-braces" fill="none" stroke="#fff" stroke-width="20" stroke-linecap="butt" stroke-linejoin="round">
    <g transform="translate(151 124)"><g><animateTransform attributeName="transform" type="rotate" values="0;0;360;360;720;720" keyTimes="0;.30;.58;.64;.92;1" dur="2s" repeatCount="indefinite" calcMode="spline" keySplines="0 0 1 1;0.45 0 0.2 1;0 0 1 1;0.3 0 0.2 1;0 0 1 1"/><g><animateTransform attributeName="transform" type="scale" values="1;1;.1;.1;1;1" keyTimes="0;.30;.58;.64;.92;1" dur="2s" repeatCount="indefinite" calcMode="spline" keySplines="0 0 1 1;0.45 0 0.2 1;0 0 1 1;0.3 0 0.2 1;0 0 1 1"/><g transform="translate(-151 -124)"><path d="M94 42 C68 42 66 55 66 76 L66 91 C66 112 57 122 42 124 C57 126 66 136 66 157 L66 172 C66 193 68 206 94 206"/></g></g></g></g>
    <g transform="translate(151 124)"><g><animateTransform attributeName="transform" type="rotate" values="0;0;360;360;720;720" keyTimes="0;.30;.58;.64;.92;1" dur="2s" repeatCount="indefinite" calcMode="spline" keySplines="0 0 1 1;0.45 0 0.2 1;0 0 1 1;0.3 0 0.2 1;0 0 1 1"/><g><animateTransform attributeName="transform" type="scale" values="1;1;.1;.1;1;1" keyTimes="0;.30;.58;.64;.92;1" dur="2s" repeatCount="indefinite" calcMode="spline" keySplines="0 0 1 1;0.45 0 0.2 1;0 0 1 1;0.3 0 0.2 1;0 0 1 1"/><g transform="translate(-151 -124)"><path d="M94 42 C68 42 66 55 66 76 L66 91 C66 112 57 122 42 124 C57 126 66 136 66 157 L66 172 C66 193 68 206 94 206" transform="translate(302 0) scale(-1 1)"/></g></g></g></g>
  </g>
  <g class="animated-symbol">
    <!-- rebond : petit saut de la boule -->
    <g><animateTransform attributeName="transform" type="translate" values="0 0;0 0;0 -16;0 0;0 -5;0 0;0 0" keyTimes="0;.87;.91;.945;.965;.985;1" dur="4s" repeatCount="indefinite"/>
    <!-- clignement : la boule s’aplatit deux fois (comme l’œil du logo du groupe) -->
    <g transform="translate(151 124)"><g><animateTransform attributeName="transform" type="scale" values="1 1;1 1;1 .08;1 1;1 1;1 .08;1 1;1 1" keyTimes="0;.78;.805;.83;.85;.87;.895;1" dur="4s" repeatCount="indefinite"/>
    <g transform="translate(-151 -124)"><rect x="122" y="95" width="58" height="58" rx="29" fill="#fff">
    <animate attributeName="rx" values="29;29;0;0;29" keyTimes="0;0.12;0.5;0.62;1" dur="4s" repeatCount="indefinite" calcMode="spline" keySplines="0.42 0 0.58 1;0.42 0 0.58 1;0.42 0 0.58 1;0.42 0 0.58 1"/>
